# WorkerSpinLockFix - default configuration.
#
# This file is read once at SKSEPlugin_Load. Changes require a game
# restart to take effect.
#
# The plugin lives in `Data/SKSE/Plugins/WorkerSpinLockFix.dll`. This
# config file should be installed alongside the DLL at the same path
# but with the .toml extension.
#
# The plugin fixes two independent Skyrim hard-freeze classes:
#   * Layer 1 - Phase4Defer:   prevents the AB-BA BSSpinLock inversion
#                              in the worker dispatcher.
#   * Layer 2 - JobWaitBreaker: recovers the main thread from the
#                              WaitForJobTask lost-wakeup hang.

[plugin]
# Master kill-switch. If false, the plugin loads but installs nothing.
# Use this to A/B test without rebuilding or removing the DLL.
enabled = true

[log]
# How often the plugin emits a one-line counter dump (Phase4Defer +
# JobWaitBreaker counters). 0 disables the periodic dump entirely.
stats_interval_s = 60

[phase4_defer]
# Layer 1: the structural fix that prevents the engine's AB-BA spinlock
# inversion. One inline wrap on the LockA acquirer (id 19369) plus two
# surgical call-site patches inside the cycle hub (id 36016+0xdcb ->
# id 40334, id 19372+0x606 -> id 40333) defer LockB acquires whenever
# the current thread holds LockA. Deferred calls drain on the same
# thread immediately after the LockA acquirer returns, so per-thread
# call ordering is preserved and the AB-BA cycle simply cannot form.
# The function entries of id 40333 / id 40334 are left pristine, so
# other mods that hook those functions continue to work.
#
# See docs/case-study/22-v2-phase4-1-cycle-hub-characterisation.md for
# the design and correctness audit, and docs/case-study/25 for the
# call-site-patch refactor.
#
# Default: true. Set to false to disable the AB-BA prevention without
# rebuilding or removing the DLL.
enabled = true

# Per-call diagnostic logging for Phase4Defer. Each entry into the
# LockA wrap and each entry into the two LockB gates emits a log line
# with the arguments, the captured return value, and the deferred-queue
# depth. Volume is high during gameplay (hundreds of lines per second)
# but spdlog buffers writes asynchronously, so the in-game cost is low.
# Recommended ON for the first AE sessions. Default: false.
diagnostic_logging = false

[job_wait_breaker]
# Layer 2: recovery for the Skyrim main-thread WaitForJobTask
# lost-wakeup hang (the second freeze class, documented in
# docs/case-study/27 and docs/case-study/28). Main::Update parks in
# WaitForJobTask on a manual-reset job-completion event; under heavy
# parallelism a producer can tear down the job queue AFTER main is
# asleep WITHOUT signalling the event, leaving main waiting forever.
#
# This module wraps WaitForJobTask (located by a version-independent
# .text body signature) to track when main is parked and on which job
# index, then a watchdog thread detects the lost-wakeup signature
# (main parked past `dwell_threshold_ms` on a job slot that has since
# been torn down to null) and recovers the engine.

# Master switch for the module.
enabled = true

# Detect-only (DEFAULT). When the lost-wakeup signature is seen, the
# module LOGS it but does NOT change engine behaviour. This is the safe
# observation mode shipped while the release path is field-validated:
# it confirms the module fires exactly when (and only when) a real
# lost-wakeup occurs, without altering any wait.
#
# Set to false to ACTIVELY recover: the watchdog delivers the missing
# completion signal (SetEvent on the parked job handle) so the main
# thread resumes. The job is already gone when this fires, so waking
# main is equivalent to the signal that was lost (worst case a
# one-frame glitch vs a permanent freeze). Enabling active mode also
# installs a process-wide WaitForSingleObjectEx wrap (tightly filtered
# to the main thread's job-wait) so the watchdog can obtain the handle.
detect_only = true

# How long the main thread must be parked in WaitForJobTask before the
# module treats it as stuck (milliseconds). Far above any legitimate
# job-wait during play, well below FreezeLogger's 15 s freeze watchdog.
dwell_threshold_ms = 3000

# Watchdog poll cadence (milliseconds).
poll_interval_ms = 1000

# Confirmation re-check window (milliseconds). After the dwell +
# teardown gate first matches, the watchdog waits this long and
# re-verifies before acting, so a legitimate late completion can never
# be raced into a spurious release.
recheck_window_ms = 250

# Verbose per-decision logging for the watchdog. Default: false.
diagnostic_logging = false
